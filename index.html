
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GREEN NOW CRM</title>
<style>
:root{--green:#28543f;--gold:#cba85f;--bg:#f5f5f2}
*{box-sizing:border-box}
body{margin:0;font:15px Arial,sans-serif;background:var(--bg);color:#192720}
header{background:#121815;color:white;padding:16px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
header strong{color:#bce5cb;font-size:21px}
nav{display:flex;gap:5px;flex-wrap:wrap}
button{cursor:pointer;border:0;border-radius:8px;padding:11px 15px;font:inherit}
nav button{background:transparent;color:white}
nav button:hover,.active{background:var(--gold)!important;color:#111!important}
main{max-width:1350px;margin:28px auto;padding:0 16px}
.card{background:white;border:1px solid #e0e5df;border-radius:13px;padding:22px;margin-bottom:17px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
label{display:block;font-weight:bold;margin:12px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid #d4ddd5;border-radius:8px;font:inherit}
textarea{min-height:85px}
.primary{background:var(--green);color:white;font-weight:bold}
.light{background:#e9f0ea;color:var(--green)}
.danger{background:#a23e3e;color:white}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px;border-bottom:1px solid #e5e5e5}
th{background:#f5f5f2}
.scroll{overflow:auto}
.muted{color:#68776d}
.hidden{display:none!important}
.alert{background:#fff1d6;border-left:5px solid #d17c20;padding:13px;margin:10px 0}
.post{padding:15px;background:#f4f7f3;border-radius:9px;margin:10px 0}
.login{max-width:430px;margin:10vh auto}
iframe{width:100%;height:82vh;border:1px solid #ddd;border-radius:9px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<section id="loginScreen" class="login card">
<h1>GREEN NOW CRM</h1>
<p>Panel demonstracyjny</p>
<label>Login</label>
<input id="login" autocomplete="username">
<label>Hasło</label>
<input id="password" type="password">
<p><button class="primary" onclick="signIn()">Zaloguj</button></p>
<p class="muted">Konto testowe: admin / DemoAdmin123!</p>
<p id="loginError"></p>
</section>

<div id="app" class="hidden">
<header>
<strong>◇ GREEN NOW CRM</strong>
<nav id="nav"></nav>
<span id="who"></span>
<button onclick="logout()">Wyloguj</button>
</header>
<main id="content"></main>
</div>

<script>
const KEY="greennow_demo_v3";
const initial={
 users:[
  {id:1,name:"Administrator",login:"admin",password:"DemoAdmin123!",role:"admin",calc:"gn4",active:true},
  {id:2,name:"Handlowiec testowy",login:"ph",password:"DemoPH123!",role:"ph",calc:"gn4",active:true},
  {id:3,name:"Biuro testowe",login:"biuro",password:"DemoBiuro123!",role:"office",active:true}
 ],
 calculators:[
  {id:"gn4",name:"GREEN NOW 4.0",file:"kalkulator-green-now-4.html",active:true}
 ],
 clients:[],tasks:[],offers:[],materials:[]
};
let db;
try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}
catch{db=structuredClone(initial)}
for(const k of Object.keys(initial))if(!Array.isArray(db[k]))db[k]=[];
let user=null,page="start",clientId=null,calcId=null;
const $=id=>document.getElementById(id);
const v=id=>$(id)?.value||"";
const id=()=>crypto.randomUUID();
const admin=()=>user?.role==="admin";
const office=()=>user?.role==="office"||admin();
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const money=n=>Number(n||0).toLocaleString("pl-PL",{style:"currency",currency:"PLN"});
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const own=c=>office()||c.owner===user.id;
const findClient=()=>db.clients.find(c=>c.id===clientId&&own(c));
const btn=(label,fn,cls="primary")=>`<button class="${cls}" onclick="${fn}">${label}</button>`;

function signIn(){
 user=db.users.find(u=>u.active&&u.login===v("login")&&u.password===v("password"));
 if(!user){$("loginError").textContent="Błędne dane";return}
 $("loginScreen").classList.add("hidden");
 $("app").classList.remove("hidden");
 go("start");
}
function logout(){
 user=null;$("app").classList.add("hidden");
 $("loginScreen").classList.remove("hidden");
}
function go(p){page=p;render()}
function render(){
 if(!user)return;
 $("who").textContent=user.name;
 const menu=[
 ["start","Start"],["calculator","Kalkulatory"],
 ["clients","Klienci"],["offers","Oferty"],
 ["tasks","Zadania"],["materials","Materiały"]
 ];
 if(office())menu.push(["verification","Weryfikacja"]);
 if(admin())menu.push(["adminCalculators","Admin: Kalkulatory"],["users","Użytkownicy"]);
 $("nav").innerHTML=menu.map(([p,n])=>`<button class="${page===p?"active":""}" onclick="go('${p}')">${n}</button>`).join("");
 const views={start,calculator,clients,clientDetail,offers,tasks,materials,verification,adminCalculators,users};
 $("content").innerHTML=(views[page]||start)();
}
function start(){
 const cs=db.clients.filter(own);
 return `<h1>Pulpit GREEN NOW</h1>
 <div class="grid">
 <div class="card"><h2>Klienci</h2><h1>${cs.length}</h1></div>
 <div class="card"><h2>Moje zadania</h2><h1>${db.tasks.filter(t=>t.owner===user.id&&!t.done).length}</h1></div>
 </div>
 <div class="card">${btn("Klienci","go('clients')")} ${btn("Kalkulatory","go('calculator')","light")}</div>`;
}
function calculator(){
 const cs=db.calculators.filter(c=>c.active&&(office()||c.id===user.calc));
 if(!cs.length)return "<h2>Brak przypisanego kalkulatora</h2>";
 const selected=cs.find(c=>c.id===calcId)||cs[0];
 calcId=selected.id;
 return `<h1>Kalkulatory</h1>
 <div class="card"><div class="row">${cs.map(c=>btn(esc(c.name),`selectCalc('${c.id}')`,c.id===calcId?"primary":"light")).join("")}</div></div>
 <div class="card"><h2>${esc(selected.name)}</h2>
 <iframe src="${esc(selected.file)}" title="Kalkulator"></iframe>
 <p class="muted">Oryginalny kalkulator jest osobnym plikiem HTML. Zapis jego ofert nie jest jeszcze połączony z CRM.</p></div>`;
}
function selectCalc(x){calcId=x;render()}

function clients(){
 return `<h1>Klienci</h1>
 <div class="card"><h2>Dodaj klienta</h2>
 <div class="grid">
 <div><label>Imię i nazwisko</label><input id="cn"></div>
 <div><label>Telefon</label><input id="ct"></div>
 <div><label>E-mail</label><input id="ce"></div>
 <div><label>Adres zamieszkania</label><input id="ca"></div>
 <div><label>Adres montażu</label><input id="cm"></div>
 <div><label>Zakres instalacji</label><input id="ci"></div>
 </div>
 <label>Finansowanie</label><select id="cf"><option>Nieustalone</option><option>Gotówka</option><option>Kredyt</option><option>Leasing</option><option>Dotacja</option></select>
 <p>${btn("Dodaj klienta","addClient()")}</p></div>
 <div class="card scroll"><table><tr><th>Klient</th><th>Instalacja</th><th>PH</th><th>Alert</th><th></th></tr>
 ${db.clients.filter(own).map(c=>`<tr>
 <td>${esc(c.name)}</td><td>${esc(c.type)}</td>
 <td>${esc(db.users.find(u=>u.id===c.owner)?.name)}</td>
 <td>${c.urgent?"❗ WAŻNE":"—"}</td>
 <td>${btn("Otwórz",`openClient('${c.id}')`)}</td>
 </tr>`).join("")}</table></div>`;
}
function addClient(){
 if(!v("cn").trim())return alert("Podaj nazwisko klienta");
 const c={id:id(),name:v("cn"),phone:v("ct"),email:v("ce"),
 address:v("ca"),mount:v("cm"),type:v("ci"),finance:v("cf"),
 owner:user.id,posts:[],docs:{},extra:"",urgent:false,status:"Nowy"};
 db.clients.push(c);save();openClient(c.id);
}
function openClient(x){clientId=x;go("clientDetail")}
const required=["Oferta","Umowa","Załączniki","Załącznik do OSD","Załącznik do dotacji"];
function clientDetail(){
 const c=findClient();
 if(!c)return "<h2>Brak dostępu</h2>";
 const ts=db.tasks.filter(t=>t.clientId===c.id);
 return `<div class="row"><h1>${esc(c.name)}</h1>${c.urgent?'<strong style="color:#b33">❗ WAŻNE</strong>':""}</div>
 <p>${btn("Wróć do klientów","go('clients')","light")}</p>
 <div class="grid">
 <div class="card"><h2>Dane klienta</h2>
 <p>Telefon: ${esc(c.phone)}</p><p>E-mail: ${esc(c.email)}</p>
 <p>Adres zamieszkania: ${esc(c.address)}</p>
 <p>Adres montażu: ${esc(c.mount)}</p>
 <p>Instalacja: ${esc(c.type)}</p>
 <p>Finansowanie: ${esc(c.finance)}</p>
 <p>Opiekun: ${esc(db.users.find(u=>u.id===c.owner)?.name)}</p>
 </div>
 <div class="card"><h2>Dokumenty do weryfikacji</h2>
 ${required.map((d,i)=>`<label><input style="width:auto" type="checkbox" ${c.docs?.[i]?"checked":""} onchange="setDoc(${i},this.checked)"> ${d}</label>`).join("")}
 <p class="muted">Statusy dokumentów — wersja demonstracyjna. Przesyłanie skanów wymaga magazynu plików.</p></div>
 </div>
 <div class="card"><h2>Dodatkowe informacje od PH</h2>
 <textarea id="extra">${esc(c.extra)}</textarea>
 <label><input style="width:auto" type="checkbox" id="urgent" ${c.urgent?"checked":""}> ❗ Bardzo ważne — pokaż alert przy kliencie</label>
 <p>${btn("Zapisz informacje","saveExtra()")}</p></div>
 ${office()?`<div class="card"><h2>Wewnętrzna tablica biura</h2>
 <textarea id="post" placeholder="Nowy wpis, aktualizacja, notatka..."></textarea>
 <p>${btn("Dodaj wpis","addPost()")}</p>
 ${(c.posts||[]).slice().reverse().map(p=>`<div class="post"><strong>${esc(p.author)}</strong> · ${esc(p.date)}<p>${esc(p.text)}</p></div>`).join("")}
 </div>`:""}
 <div class="card"><h2>Zadania klienta</h2>
 ${office()?`<label>Treść zadania</label><textarea id="taskText"></textarea>
 <label>Przypisz pracownikowi</label><select id="taskOwner">${db.users.filter(u=>u.active).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}</select>
 <label>Termin</label><input id="taskDate" type="date">
 <p>${btn("Dodaj zadanie","addClientTask()")}</p>`:""}
 ${ts.filter(t=>office()||t.owner===user.id).map(t=>`<div class="post">${esc(t.text)} — ${t.done?"Wykonane":"Do wykonania"} (${esc(t.date)}) ${!t.done?btn("Zakończ",`finishTask('${t.id}')`,"light"):""}</div>`).join("")}
 </div>`;
}
function setDoc(i,checked){
 if(!office())return;
 const c=findClient();if(!c)return;
 c.docs[i]=checked;save();
}
function saveExtra(){
 const c=findClient();if(!c)return;
 c.extra=v("extra");c.urgent=$("urgent").checked;
 save();render();
}
function addPost(){
 if(!office())return;
 const c=findClient();if(!c||!v("post").trim())return;
 c.posts.push({text:v("post"),author:user.name,date:new Date().toLocaleString("pl-PL")});
 save();render();
}
function addClientTask(){
 if(!office()||!v("taskText").trim())return;
 db.tasks.push({id:id(),clientId:clientId,text:v("taskText"),owner:Number(v("taskOwner")),date:v("taskDate"),done:false});
 save();render();
}
function finishTask(x){
 const t=db.tasks.find(t=>t.id===x);
 if(!t||(!office()&&t.owner!==user.id))return;
 t.done=true;save();render();
}
function tasks(){
 return `<h1>Zadania</h1><div class="card">
 ${db.tasks.filter(t=>office()||t.owner===user.id).map(t=>{
 const c=db.clients.find(c=>c.id===t.clientId);
 return `<div class="post">${esc(t.text)} — ${esc(c?.name)}
 ${btn("Otwórz klienta",`openClient('${t.clientId}')`,"light")}</div>`;
 }).join("")||"Brak zadań"}</div>`;
}
function offers(){
 return `<h1>Oferty</h1><div class="card">
 <p>Oferty z kalkulatora GREEN NOW 4.0 wymagają integracji z bazą CRM.</p>
 ${btn("Otwórz kalkulatory","go('calculator')")}
 </div>`;
}
function verification(){
 if(!office())return "<h2>Brak dostępu</h2>";
 return `<h1>Weryfikacja</h1><div class="card scroll">
 <table><tr><th>Klient</th><th>Dokumenty</th><th>Ważne</th><th>Akcje</th></tr>
 ${db.clients.map(c=>`<tr><td>${esc(c.name)}</td>
 <td>${required.filter((_,i)=>c.docs?.[i]).length}/5</td>
 <td>${c.urgent?"❗":"—"}</td>
 <td>${btn("Otwórz",`openClient('${c.id}')`)}</td></tr>`).join("")}
 </table></div>`;
}
function materials(){
 return `<h1>Materiały</h1><div class="card">
 <p>Foldery, pliki PDF i kontrola dostępu wymagają podłączenia magazynu plików.</p>
 </div>`;
}
function adminCalculators(){
 if(!admin())return "<h2>Brak dostępu</h2>";
 return `<h1>Admin / Kalkulatory</h1>
 ${db.calculators.map(c=>{
 const us=db.users.filter(u=>u.role==="ph"&&u.calc===c.id);
 return `<div class="card"><h2>${esc(c.name)}</h2>
 <p>Przypisanych PH: <b>${us.length}</b> · Aktywnych: ${us.filter(u=>u.active).length}</p>
 <p>${us.map(u=>esc(u.name)).join(", ")||"Brak przypisanych"}</p>
 <p>Plik: ${esc(c.file)}</p>
 ${btn("Edytuj",`editCalc('${c.id}')`,"light")}
 ${btn(c.active?"Wyłącz":"Włącz",`toggleCalc('${c.id}')`,"light")}
 </div>`;
 }).join("")}
 <div class="card"><h2>Dodaj kalkulator / grupę</h2>
 <label>Nazwa kalkulatora</label><input id="newCalcName">
 <label>Nazwa pliku HTML</label><input id="newCalcFile" placeholder="kalkulator-partner.html">
 <p>${btn("Dodaj kalkulator","addCalc()")}</p></div>`;
}
function validFile(f){return /^[a-zA-Z0-9_-]+\.html$/.test(f)}
function addCalc(){
 if(!admin())return;
 const name=v("newCalcName").trim(),file=v("newCalcFile").trim();
 if(!name||!validFile(file))return alert("Podaj nazwę i poprawną nazwę pliku HTML");
 db.calculators.push({id:id(),name,file,active:true});
 save();render();
}
function editCalc(x){
 if(!admin())return;
 const c=db.calculators.find(c=>c.id===x);
 const name=prompt("Nazwa kalkulatora",c.name);
 if(name===null)return;
 const file=prompt("Plik HTML",c.file);
 if(file===null)return;
 if(!name.trim()||!validFile(file))return alert("Niepoprawne dane");
 c.name=name.trim();c.file=file;save();render();
}
function toggleCalc(x){
 if(!admin())return;
 const c=db.calculators.find(c=>c.id===x);
 c.active=!c.active;save();render();
}
function users(){
 if(!admin())return "<h2>Brak dostępu</h2>";
 return `<h1>Użytkownicy</h1>
 <div class="card"><h2>Dodaj użytkownika</h2>
 <label>Imię i nazwisko</label><input id="un">
 <label>Login</label><input id="ul">
 <label>Hasło</label><input id="up" type="password">
 <label>Rola</label><select id="ur"><option value="ph">PH</option><option value="office">Biuro</option><option value="admin">Administrator</option></select>
 <label>Kalkulator / grupa</label><select id="uc">${db.calculators.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select>
 <p>${btn("Utwórz użytkownika","addUser()")}</p></div>
 <div class="card scroll"><table><tr><th>Użytkownik</th><th>Rola</th><th>Kalkulator</th><th>Status</th></tr>
 ${db.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.role)}</td>
 <td><select onchange="assignCalc(${u.id},this.value)">
 ${db.calculators.map(c=>`<option value="${c.id}" ${u.calc===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></td>
 <td>${u.active?"Aktywny":"Zablokowany"}</td></tr>`).join("")}</table></div>`;
}
function addUser(){
 if(!admin())return;
 if(!v("un")||!v("ul")||v("up").length<8)return alert("Uzupełnij dane. Hasło minimum 8 znaków.");
 if(db.users.some(u=>u.login===v("ul")))return alert("Login zajęty");
 db.users.push({id:Date.now(),name:v("un"),login:v("ul"),password:v("up"),role:v("ur"),calc:v("uc"),active:true});
 save();render();
}
function assignCalc(x,c){
 if(!admin())return;
 const u=db.users.find(u=>u.id===x);
 if(u){u.calc=c;save();render()}
}
</script>
</body>
</html>
