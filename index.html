
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GREEN NOW CRM</title>
<style>
:root {
  --green:#205841;
  --dark:#121715;
  --gold:#cba458;
  --bg:#f5f5f2;
  --border:#e2e6e1;
}
* {box-sizing:border-box}
body {margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17241e}
button,input,select,textarea {font:inherit}
button {cursor:pointer}
header {
  background:var(--dark);color:white;padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;
  gap:20px;flex-wrap:wrap
}
.logo {font-weight:800;font-size:21px;color:#a9ddbc}
nav {display:flex;gap:7px;flex-wrap:wrap}
nav button {
  border:0;background:transparent;color:white;
  padding:11px;border-radius:7px
}
nav button.active,nav button:hover {background:var(--gold);color:#111}
main {max-width:1250px;margin:30px auto;padding:0 18px}
h1 {font-size:25px;margin-bottom:5px}
h2 {font-size:18px;margin:0 0 16px}
p {color:#65746b}
.card {
  background:white;border:1px solid var(--border);
  border-radius:13px;padding:22px;margin-bottom:16px;
  box-shadow:0 2px 5px #00000008
}
.grid {display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.grid3 {display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
label {display:block;font-size:13px;font-weight:bold;margin:12px 0 6px}
input,select,textarea {
  width:100%;border:1px solid #d3dbd4;border-radius:8px;
  padding:11px;background:white
}
.btn {
  border:0;background:var(--green);color:white;
  padding:11px 17px;border-radius:8px;font-weight:bold
}
.btn:hover {filter:brightness(1.12)}
.btn.gold {background:var(--gold);color:#111}
.btn.light {background:#e8eee9;color:var(--green)}
.btn.red {background:#a43b3b}
.actions {display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
table {width:100%;border-collapse:collapse;font-size:13px}
th,td {padding:13px;text-align:left;border-bottom:1px solid var(--border)}
th {background:#f5f6f3}
.tablewrap {overflow-x:auto}
.stat {font-size:26px;font-weight:800;color:var(--green)}
.small {font-size:12px;color:#78877d}
.badge {background:#e4f3e8;color:#17643b;border-radius:20px;padding:5px 9px;font-size:12px}
.hidden {display:none!important}
.login {
  max-width:420px;margin:90px auto;background:white;
  padding:35px;border-radius:18px;box-shadow:0 10px 35px #0001
}
.login h1 {text-align:center;color:var(--green)}
.notice {background:#fff4d9;padding:12px;border-radius:8px;font-size:12px;margin-top:16px}
.message {padding:10px;background:#e8f4ec;border-radius:8px;margin:10px 0}
@media(max-width:700px){
 .grid,.grid3 {grid-template-columns:1fr}
 header {padding:12px}
 nav {overflow:auto}
 .card {padding:15px}
}
input[type="checkbox"]{width:auto} .card .message{margin-top:10px} .card p{line-height:1.5}
</style>
</head>
<body>

<div id="loginPage" class="login">
  <h1>GREEN NOW CRM</h1>
  <p style="text-align:center">Panel zarządzania OZE</p>
  <label>Login</label>
  <input id="login" placeholder="Wpisz login">
  <label>Hasło</label>
  <input id="password" type="password" placeholder="Wpisz hasło">
  <div class="actions">
    <button class="btn" style="width:100%" onclick="signIn()">Zaloguj się</button>
  </div>
  <p id="loginError" style="color:#b33"></p>
  <div class="notice">
    KONTA TESTOWE<br>
    Administrator: admin / DemoAdmin123!<br>
    PH: ph / DemoPH123!<br>
    Biuro: biuro / DemoBiuro123!<br><br>
    Wyłącznie demonstracja. Nie używaj prawdziwych danych.
  </div>
</div>

<div id="app" class="hidden">
<header>
  <div class="logo">◈ GREEN NOW CRM</div>
  <nav id="navigation"></nav>
  <div>
    <span id="loggedUser"></span>
    <button class="btn light" onclick="logout()">Wyloguj</button>
  </div>
</header>
<main id="content"></main>
</div>

<script>
const KEY="greennow_crm_demo_v1";

const defaults={
 users:[
  {id:1,name:"Administrator",login:"admin",password:"DemoAdmin123!",role:"admin",active:true},
  {id:2,name:"Przedstawiciel handlowy",login:"ph",password:"DemoPH123!",role:"ph",active:true},
  {id:3,name:"Pracownik biura",login:"biuro",password:"DemoBiuro123!",role:"office",active:true}
 ],
 offers:[],
 clients:[],
 materials:[],
 tasks:[]
};

let db;
try {
 db=JSON.parse(localStorage.getItem(KEY))||defaults;
} catch(e) {db=defaults}
db.posts=db.posts||[];
db.clients=db.clients||[];
db.tasks=db.tasks||[];
db.calculators=db.calculators||[{id:"gn4",name:"Kalkulator GREEN NOW 4.0",file:"kalkulator-green-now-4.html",active:true}];
db.calculators.forEach(c=>{if(c.id==='gn4'&&c.file==='kalkulator-green-now-4.html')c.file='https://green-now.github.io/PV-K4.0/'});
db.users.forEach(u=>{if(u.role==="ph"&&u.calculatorId===undefined)u.calculatorId="gn4";if(u.marginVisibility===undefined)u.marginVisibility="hidden"});
let selectedClientId=null;
let current=null;
let page="dashboard";

function save(){
 localStorage.setItem(KEY,JSON.stringify(db));
}
function money(n){
 return Number(n||0).toLocaleString("pl-PL",{
  style:"currency",currency:"PLN"
 });
}
function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[c]);
}
function byId(id){return document.getElementById(id)}
function val(id){return byId(id)?.value||""}
function uid(){return Date.now()+Math.floor(Math.random()*10000)}
function isAdmin(){return current?.role==="admin"}
function isOffice(){return current?.role==="office"}
function canManage(){return isAdmin()||isOffice()}
function own(items){
 return isAdmin()||isOffice()
 ?items:items.filter(x=>x.owner===current.id);
}
function roleName(r){
 return ({admin:"Administrator",office:"Biuro",ph:"PH"})[r]||r;
}
function button(text,action,style=""){
 return `<button class="btn ${style}" onclick="${action}">${text}</button>`;
}
function signIn(){
 const u=db.users.find(x=>x.login===val("login")&&
 x.password===val("password")&&x.active);
 if(!u){
  byId("loginError").textContent="Nieprawidłowy login lub hasło.";
  return;
 }
 current=u;
 byId("loginPage").classList.add("hidden");
 byId("app").classList.remove("hidden");
 page="dashboard";
 render();
}
function logout(){
 current=null;
 byId("app").classList.add("hidden");
 byId("loginPage").classList.remove("hidden");
 byId("password").value="";
}
function go(p){page=p;render()}
function openClient(id){selectedClientId=id;go('clientDetail')}
function clientAccess(c){return c&&(canManage()||c.owner===current.id)}
function clientName(id){return db.clients.find(c=>c.id===id)?.name||'Nieprzypisany'}
function render(){
 if(!current)return;
 byId("loggedUser").textContent=current.name+" • "+roleName(current.role);
 let menus=[
  ["dashboard","Start"],
  ["calculator","Kalkulator"],
  ["offers","Oferty"],
  ["clients","Klienci"],
  ["commissions","Prowizje"],
  ["materials","Materiały"],
  ["tasks","Zadania"]
 ];
 if(canManage())menus.push(["approvals","Weryfikacja"]);
 if(isAdmin())menus.push(["adminCalculators","Admin: Kalkulatory"],["users","Użytkownicy"]);
 byId("navigation").innerHTML=menus.map(([id,name])=>
 `<button class="${page===id?"active":""}" onclick="go('${id}')">${name}</button>`
 ).join("");
 const views={
  dashboard:dashboard,
  calculator:calculator,
  offers:offers,
  clients:clients,
  commissions:commissions,
  materials:materials,
  tasks:tasks,
  approvals:approvals,
  users:users,
  adminCalculators:adminCalculators
 };
 byId("content").innerHTML=(views[page]||dashboard)();
 if(page==="calculator")calculate();
}

function dashboard(){
 const o=own(db.offers);
 const c=own(db.clients);
 return `<h1>Strona główna</h1>
 <p>Witaj, ${esc(current.name)}. Twój panel GREEN NOW.</p>
 <div class="grid3">
  <div class="card"><div class="small">Oferty</div><div class="stat">${o.length}</div></div>
  <div class="card"><div class="small">Klienci</div><div class="stat">${c.length}</div></div>
  <div class="card"><div class="small">Do zatwierdzenia</div><div class="stat">${o.filter(x=>x.status==="Do weryfikacji").length}</div></div>
 </div>
 <div class="card">
  <h2>Szybkie działania</h2>
  <div class="actions">
   ${button("Nowa wycena","go('calculator')")}
   ${button("Klienci","go('clients')","light")}
   ${button("Moje oferty","go('offers')","light")}
  </div>
 </div>`;
}

function calculator(){
 const available=db.calculators.filter(c=>c.active&&(canManage()||current.calculatorId===c.id));
 const chosen=available.find(c=>c.id===selectedCalculatorId)||available[0];
 if(!chosen)return `<h1>Kalkulatory</h1><div class="card">Nie przypisano Ci aktywnego kalkulatora. Skontaktuj się z administratorem.</div>`;
 selectedCalculatorId=chosen.id;
 const file=allowedCalcFile(chosen.file);
 return `<h1>Kalkulatory</h1><p>Twój przypisany kalkulator i jego własny cennik.</p>
 ${available.length>1?`<div class="card"><label>Wybierz kalkulator</label><select onchange="selectCalculator(this.value)">${available.map(c=>`<option value="${esc(c.id)}" ${c.id===chosen.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`:''}
 <div class="card"><h2>${esc(chosen.name)}</h2>${file?`<iframe title="${esc(chosen.name)}" src="${esc(file)}" style="width:100%;height:82vh;border:1px solid #ddd;border-radius:8px;background:white"></iframe><p class="small"><a href="${esc(file)}" target="_blank" rel="noopener">Otwórz w nowej karcie</a></p>`:'Nieprawidłowy plik kalkulatora.'}</div>`;
}
let selectedCalculatorId="gn4";
function selectCalculator(id){selectedCalculatorId=id;render()}
function allowedCalcFile(f){if(/^[a-zA-Z0-9_-]+\.html$/.test(f||''))return f;try{const u=new URL(f);return u.protocol==='https:'?u.href:null}catch(e){return null}}
function calculate(){
 const base=Math.max(0,Number(val("calcBase"))||0);
 const pct=Math.max(0,Number(val("calcMargin"))||0);
 const vat=Number(val("calcVat"))||8;
 const margin=base*pct/100;
 const net=base+margin;
 byId("resultBase").textContent=money(base);
 byId("resultMargin").textContent=money(margin);
 byId("resultNet").textContent=money(net);
 byId("resultGross").textContent=money(net*(1+vat/100));
}
function saveOffer(){
 const client=val("calcClient").trim();
 if(!client){alert("Wpisz imię i nazwisko klienta.");return}
 const base=Math.max(0,Number(val("calcBase"))||0);
 const pct=Math.max(0,Number(val("calcMargin"))||0);
 const vat=Number(val("calcVat"));
 const margin=base*pct/100;
 const net=base+margin;
 const id=uid();
 db.offers.push({
  id,client,owner:current.id,
  type:val("calcType"),base,pct,margin,net,vat,
  gross:net*(1+vat/100),
  notes:val("calcNotes"),status:"Robocza",
  commission:0,commissionStatus:"Nieustalona",
  date:new Date().toLocaleDateString("pl-PL")
 });
 db.clients.push({
  id:uid(),name:client,owner:current.id,
  type:val("calcType"),status:"Oferta",
  notes:"",offerId:id
 });
 save();go("offers");
}
function offers(){
 const rows=own(db.offers);
 return `<h1>Historia ofert</h1>
 <p>Wyceny zapisane w systemie.</p>
 <div class="card tablewrap">
 <table><thead><tr>
 <th>Klient</th><th>Instalacja</th><th>Cena netto</th>
 <th>Marża netto</th><th>Status</th><th>Akcje</th>
 </tr></thead><tbody>
 ${rows.map(o=>`<tr>
 <td>${esc(o.client)}</td>
 <td>${esc(o.type)}</td>
 <td>${money(o.net)}</td>
 <td>${money(o.margin)}</td>
 <td><span class="badge">${esc(o.status)}</span></td>
 <td>${o.status==="Robocza"?
 button("Przekaż do biura",`sendOffer(${o.id})`):"—"}</td>
 </tr>`).join("")||'<tr><td colspan="6">Brak ofert.</td></tr>'}
 </tbody></table></div>`;
}
function sendOffer(id){
 const o=db.offers.find(x=>x.id===id);
 if(!o||(!canManage()&&o.owner!==current.id))return;
 o.status="Do weryfikacji";save();render();
}
function approvals(){
 if(!canManage())return "<h1>Brak dostępu</h1>";
 const rows=db.offers.filter(x=>x.status==="Do weryfikacji");
 return `<h1>Skrzynka umów i ofert</h1>
 <p>Oferty przekazane przez PH do weryfikacji.</p>
 <div class="card tablewrap"><table>
 <tr><th>Klient</th><th>PH</th><th>Wartość netto</th><th>Akcje</th></tr>
 ${rows.map(o=>`<tr>
 <td>${esc(o.client)}</td>
 <td>${esc(db.users.find(u=>u.id===o.owner)?.name)}</td>
 <td>${money(o.net)}</td>
 <td>
 ${button("Zatwierdź",`approve(${o.id},true)`)}
 ${button("Odrzuć",`approve(${o.id},false)`,"red")}
 </td></tr>`).join("")||'<tr><td colspan="4">Brak ofert do weryfikacji.</td></tr>'}
 </table></div>`;
}
function approve(id,accepted){
 if(!canManage())return;
 const o=db.offers.find(x=>x.id===id);
 if(!o)return;
 o.status=accepted?"Zaakceptowana":"Odrzucona";
 save();render();
}
function clients(){
 return `<h1>Klienci</h1><p>Kliknij klienta, aby otworzyć jego tablicę.</p>
 <div class="card"><h2>Dodaj klienta</h2><div class="grid">
 <div><label>Imię i nazwisko</label><input id="newClient"></div>
 <div><label>Zakres montażu</label><input id="newType"></div></div>
 <label>Notatki</label><textarea id="newNotes"></textarea>
 <div class="actions">${button('Dodaj klienta','addClient()')}</div></div>
 <div class="card tablewrap"><table><tr><th>Klient</th><th>Zakres</th><th>Etap</th><th>PH</th><th></th></tr>
 ${own(db.clients).map(c=>`<tr><td><button class="btn light" onclick="openClient(${Number(c.id)})">${esc(c.name)}</button></td>
 <td>${esc(c.type)}</td><td>${esc(c.status)}</td><td>${esc(db.users.find(u=>u.id===c.owner)?.name)}</td>
 <td>${button('Otwórz tablicę',`openClient(${Number(c.id)})`)}</td></tr>`).join('')||'<tr><td colspan="5">Brak klientów.</td></tr>'}</table></div>`;
}
function addClient(){
 const name=val('newClient').trim();if(!name)return alert('Podaj imię i nazwisko.');
 const id=uid();db.clients.push({id,name,owner:current.id,type:val('newType'),notes:val('newNotes'),status:'Nowy'});
 save();openClient(id);
}
function clientDetail(){
 const c=db.clients.find(x=>x.id===selectedClientId);
 if(!clientAccess(c))return `<h1>Brak dostępu do klienta</h1>${button('Wróć',"go('clients')")}`;
 const posts=db.posts.filter(p=>p.clientId===c.id).sort((a,b)=>b.id-a.id);
 const tasks=db.tasks.filter(t=>t.clientId===c.id);
 const offers=db.offers.filter(o=>o.clientId===c.id||o.offerId===c.offerId||(o.client===c.name&&o.owner===c.owner));
 return `<div class="actions">${button('← Lista klientów',"go('clients')",'light')}</div>
 <h1>${esc(c.name)}</h1><p>Opiekun: ${esc(db.users.find(u=>u.id===c.owner)?.name||'—')} • ${esc(c.type||'Bez zakresu')}</p>
 <div class="grid"><div class="card"><h2>Dane klienta</h2><label>Status</label>
 <select id="clientStatus"><option>${esc(c.status)}</option>${['Nowy','Kontakt','Oferta','Umowa','Realizacja','Zakończony','Utracony'].filter(x=>x!==c.status).map(x=>`<option>${x}</option>`).join('')}</select>
 <label>Zakres</label><input id="clientType" value="${esc(c.type||'')}">
 <label>Notatka główna</label><textarea id="clientNotes">${esc(c.notes||'')}</textarea>
 <div class="actions">${button('Zapisz dane','saveClientDetails()')}</div></div>
 <div class="card"><h2>Nowy wpis na tablicy</h2><label>Treść wpisu</label><textarea id="postText" rows="4" placeholder="Rozmowa, ustalenia, ważne informacje..."></textarea>
 <label>Zdjęcie lub dokument (wersja demo: do 1 MB)</label><input id="postFile" type="file" accept="image/*,.pdf,.txt">
 <div class="actions">${button('Dodaj wpis','addClientPost()')}</div>
 <div class="notice">Załączniki demo przechowywane lokalnie w tej przeglądarce. Nie dodawaj prawdziwych umów ani danych osobowych.</div></div></div>
 <div class="grid"><div class="card"><h2>Zadania klienta</h2><label>Zadanie</label><input id="clientTaskText" placeholder="Np. Zadzwonić w sprawie umowy">
 <label>Termin</label><input id="clientTaskDate" type="date"><label>Przypisz do</label>
 <select id="clientTaskOwner">${db.users.filter(u=>u.active&&(canManage()||u.id===current.id)).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select>
 <div class="actions">${button('Dodaj zadanie','addClientTask()')}</div>
 ${tasks.map(t=>`<div class="message"><b>${esc(t.text)}</b><div class="small">${esc(t.due||'Bez terminu')} • ${esc(db.users.find(u=>u.id===t.owner)?.name||'—')} • ${t.done?'Wykonane':'Do wykonania'}</div>${!t.done&&(canManage()||t.owner===current.id)?button('Zakończ',`finishTask(${t.id})`,'light'):''}</div>`).join('')||'<p>Brak zadań.</p>'}</div>
 <div class="card"><h2>Oferty klienta</h2>${offers.map(o=>`<div class="message">${esc(o.type)} — ${money(o.net)} • ${esc(o.status)}</div>`).join('')||'<p>Brak ofert przypisanych do klienta.</p>'}
 <p class="small">Kalkulator 4.0 działa w osobnej zakładce. Automatyczne powiązanie jego ofert wymaga integracji zapisu.</p></div></div>
 <div class="card"><h2>Tablica / historia klienta</h2>${posts.map(p=>`<div class="message"><div class="small">${esc(p.date)} • ${esc(db.users.find(u=>u.id===p.author)?.name||'Użytkownik')}</div>
 <p style="white-space:pre-wrap;color:#17241e">${esc(p.text)}</p>${p.fileData?`<a href="${p.fileData}" download="${esc(p.fileName||'zalacznik')}">📎 ${esc(p.fileName)}</a>`:''}</div>`).join('')||'<p>Brak wpisów na tablicy.</p>'}</div>`;
}
function saveClientDetails(){const c=db.clients.find(x=>x.id===selectedClientId);if(!clientAccess(c))return;
 c.status=val('clientStatus');c.type=val('clientType');c.notes=val('clientNotes');save();render();}
function addClientPost(){const c=db.clients.find(x=>x.id===selectedClientId);if(!clientAccess(c))return;
 const content=val('postText').trim(),file=byId('postFile').files[0];if(!content&&!file)return alert('Dodaj treść lub plik.');
 if(file&&file.size>1024*1024)return alert('Wersja demo: maksymalnie 1 MB.');
 if(file&&!(/^(image\/|application\/pdf$|text\/plain$)/.test(file.type)))return alert('Dozwolone zdjęcia, PDF i TXT.');
 const record={id:uid(),clientId:c.id,author:current.id,date:new Date().toLocaleString('pl-PL'),text:content};
 const finish=()=>{db.posts.push(record);try{save();render()}catch(e){db.posts.pop();alert('Brak miejsca w pamięci przeglądarki.')}};
 if(file){const reader=new FileReader();reader.onload=()=>{record.fileData=reader.result;record.fileName=file.name;finish()};reader.readAsDataURL(file)}else finish();
}
function addClientTask(){const c=db.clients.find(x=>x.id===selectedClientId);if(!clientAccess(c))return;
 const text=val('clientTaskText').trim(),owner=Number(val('clientTaskOwner'));if(!text)return alert('Podaj zadanie.');
 if(!canManage()&&owner!==current.id)return;
 db.tasks.push({id:uid(),clientId:c.id,text,owner,due:val('clientTaskDate'),done:false});save();render();}
function commissions(){
 return `<h1>Prowizje i rozliczenia</h1>
 <p>Marża handlowa i prowizja wypłacana to oddzielne wartości.</p>
 <div class="card tablewrap"><table>
 <tr><th>Klient</th><th>Marża netto</th><th>Prowizja PH</th>
 <th>Status</th><th>Akcje</th></tr>
 ${own(db.offers).map(o=>`<tr>
 <td>${esc(o.client)}</td>
 <td>${money(o.margin)}</td>
 <td>${money(o.commission)}</td>
 <td>${esc(o.commissionStatus)}</td>
 <td>${isAdmin()?button("Ustal prowizję",`setCommission(${o.id})`):"—"}</td>
 </tr>`).join("")||'<tr><td colspan="5">Brak rozliczeń.</td></tr>'}
 </table></div>`;
}
function setCommission(id){
 if(!isAdmin())return;
 const o=db.offers.find(x=>x.id===id);
 if(!o)return;
 const amount=prompt("Kwota prowizji PH netto (zł):",o.commission);
 if(amount===null)return;
 const n=Number(amount.replace(",","."));
 if(!Number.isFinite(n)||n<0)return alert("Nieprawidłowa kwota.");
 o.commission=n;
 const status=prompt(
  "Status: Oczekująca / FV otrzymana / Wypłacona",
  o.commissionStatus==="Nieustalona"?"Oczekująca":o.commissionStatus
 );
 if(status!==null&&["Oczekująca","FV otrzymana","Wypłacona"].includes(status)){
  o.commissionStatus=status;
 }
 save();render();
}
function materials(){
 return `<h1>Materiały do pobrania</h1>
 ${isAdmin()?`<div class="card">
 <h2>Dodaj materiał</h2>
 <label>Nazwa dokumentu</label><input id="materialName">
 <label>Link do dokumentu (HTTPS)</label><input id="materialUrl">
 <div class="actions">${button("Dodaj materiał","addMaterial()")}</div>

function commissionDetailView(){if(!canManage())return '<h2>Brak dostępu</h2>';const o=db.offers.find(x=>x.id===selectedOfferId);if(!o)return 'Brak oferty';const b=breakdown(o);return `<h1>Rozliczenie — ${esc(o.client)}</h1><div class="card"><p>Marża PH netto: <b>${money(b.ph)}</b></p><p>Koszty dodatkowe: ${money(b.costs)}</p><h2>Prowizja po kosztach dodatkowych netto: ${money(b.ph-b.costs)}</h2><label>Status rozliczenia</label>${pick('settleStatus',settlementStatuses,o.commissionStatus||'Do rozliczenia')}<div class="actions">${button('Zapisz status','saveSettleStatus()')}</div></div><div class="card"><h2>Dodaj koszt dodatkowy</h2>${field('costName','Za co / opis')}${field('costAmount','Kwota netto zł','','number')}<div class="actions">${button('Dodaj koszt','addCost()')}</div>${(o.extraCosts||[]).map((x,i)=>`<div class="message">${esc(x.name)} — ${money(x.amount)} ${button('Usuń',`removeCost(${i})`,'light')}</div>`).join('')}</div>`}
function saveSettleStatus(){const o=db.offers.find(x=>x.id===selectedOfferId);if(!canManage()||!o)return;o.commissionStatus=val('settleStatus');save();render()}
function addCost(){const o=db.offers.find(x=>x.id===selectedOfferId);if(!canManage()||!o||!val('costName').trim())return alert('Podaj opis kosztu');o.extraCosts=o.extraCosts||[];o.extraCosts.push({name:val('costName'),amount:num(val('costAmount'))});save();render()}
function removeCost(i){const o=db.offers.find(x=>x.id===selectedOfferId);if(!canManage()||!o)return;o.extraCosts.splice(i,1);save();render()}
function tasks(){const active=db.tasks.filter(t=>!t.done&&(canManage()||t.owner===current.id));return `<h1>Zadania niewykonane</h1><p>Wyświetlane są tylko zadania oczekujące na wykonanie przez PH.</p><div class="card">${active.map(t=>`<div class="message"><b>${esc(t.text)}</b><p>Klient: ${esc(clientName(t.clientId))} · PH: ${esc(db.users.find(u=>u.id===t.owner)?.name)} · Termin: ${esc(t.due||'brak')}</p>${button('Otwórz klienta',`openClient(${t.clientId})`,'light')} ${button('Oznacz jako wykonane',`finishTask(${t.id})`)}</div>`).join('')||'Brak niewykonanych zadań'}</div>`}
function approvals(){if(!canManage())return '<h2>Brak dostępu</h2>';return `<h1>Weryfikacja — pełna lista klientów i umów</h1><div class="card tablewrap"><table><tr><th>Klient</th><th>PH</th><th>Adres montażu</th><th>Zakres</th><th>Status umowy</th><th>Dokumenty</th><th>Akcje</th></tr>${db.clients.map(c=>`<tr><td>${esc(c.name)} ${c.urgent?'❗':''}</td><td>${esc(db.users.find(u=>u.id===c.owner)?.name)}</td><td>${esc(c.mountAddress||'—')}</td><td>${esc(c.type)}</td><td>${esc(c.status)}</td><td>${docsNeeded.filter(d=>c.docs?.[d]==='Zatwierdzono').length}/5</td><td>${button('Karta / weryfikacja',`openClient(${c.id})`,'light')}</td></tr>`).join('')}</table></div>`}
function materials(){const fs=db.folders.filter(f=>f.parent===folderId),ms=db.materials.filter(m=>(m.folderId||'root')===folderId);return `<h1>Materiały — foldery i PDF</h1><p>Wersja demonstracyjna: pliki są zapisane wyłącznie w przeglądarce, nie są udostępniane innym pracownikom.</p><div class="card"><h2>Folder: ${esc(db.folders.find(f=>f.id===folderId)?.name||'Główne')}</h2><div class="actions">${folderId!=='root'?button('← Folder nadrzędny','folderBack()','light'):''}${isAdmin()?button('Nowy folder','newFolder()'):''}</div>${fs.map(f=>`<div class="message">📁 <button class="btn light" onclick="openFolder('${f.id}')">${esc(f.name)}</button></div>`).join('')}${ms.map(m=>`<div class="message">📄 <a href="${esc(m.data||m.url)}" ${m.data?`download="${esc(m.name)}"`:'target="_blank" rel="noopener"'}>${esc(m.name)}</a></div>`).join('')||'<p>Brak plików w tym folderze.</p>'}</div>${isAdmin()?`<div class="card"><h2>Dodaj plik PDF</h2><label>Wybierz plik</label><input id="materialPDF" type="file" accept=".pdf,application/pdf"><p class="small">Limit wersji testowej: 1 MB / plik.</p><div class="actions">${button('Dodaj PDF','uploadPDF()')}</div></div>`:''}`}
function openFolder(id){folderId=id;render()}
function folderBack(){folderId=db.folders.find(f=>f.id===folderId)?.parent||'root';render()}
function newFolder(){if(!isAdmin())return;const name=prompt('Nazwa nowego folderu');if(!name?.trim())return;db.folders.push({id:'folder'+uid(),name:name.trim(),parent:folderId});save();render()}
function uploadPDF(){if(!isAdmin())return;const f=byId('materialPDF')?.files?.[0];if(!f||!f.name.toLowerCase().endsWith('.pdf'))return alert('Wybierz PDF');if(f.size>1024*1024)return alert('Plik przekracza 1 MB. Wersja produkcyjna wymaga magazynu plików.');const r=new FileReader();r.onload=()=>{db.materials.push({id:uid(),name:f.name,data:r.result,folderId});try{save();render()}catch(e){db.materials.pop();alert('Za mało pamięci przeglądarki')}};r.readAsDataURL(f)}
function adminCalculators(){if(!isAdmin())return '<h2>Brak dostępu</h2>';return `<h1>Admin — Kalkulatory i grupy</h1><div class="grid">${db.calculators.map(c=>`<div class="card"><h2>${esc(c.name)}</h2><p>PH: ${db.users.filter(u=>u.calculatorId===c.id&&u.role==='ph').length}</p><p>Lider: ${esc(db.users.find(u=>u.id===c.leaderId)?.name||'Nieustalony')} · ${money(c.leaderCommission)}</p><p>Opiekun: ${esc(db.users.find(u=>u.id===c.guardianId)?.name||'Nieustalony')} · ${money(c.guardianCommission)}</p><p class="small">Lider: ${esc(c.leaderFor||'—')} · opiekun: ${esc(c.guardianFor||'—')}</p><div class="actions">${button('Edytuj grupę',`groupEdit('${c.id}')`,'light')}${button(c.active?'Wyłącz':'Włącz',`toggleCalculator('${c.id}')`,'light')}</div></div>`).join('')}</div><div class="card"><h2>Dodaj kalkulator / grupę</h2>${field('newCalcName','Nazwa grupy')}${field('newCalcFile','Adres HTTPS lub plik HTML')}<div class="actions">${button('Dodaj','addCalculator()')}</div></div>`}
function groupEdit(id){const c=db.calculators.find(x=>x.id===id);if(!isAdmin()||!c)return;selectedCalculatorId=id;go('groupEdit')}
function groupEditView(){const c=db.calculators.find(x=>x.id===selectedCalculatorId);if(!isAdmin()||!c)return '<h2>Brak dostępu</h2>';const people=db.users.filter(u=>u.active);const options=(id,chosen)=>`<select id="${id}"><option value="">Nieustalony</option>${people.map(u=>`<option value="${u.id}" ${u.id===chosen?'selected':''}>${esc(u.name)}</option>`).join('')}</select>`;return `<h1>Grupa — ${esc(c.name)}</h1><div class="card"><div class="grid">${field('groupName','Nazwa grupy',c.name)}${field('groupFile','Link HTTPS / plik HTML',c.file)}<div><label>Lider grupy</label>${options('groupLeader',c.leaderId)}</div>${field('groupLeaderAmount','Nadprowizja lidera netto (zł / oferta)',c.leaderCommission||0,'number')}${field('groupLeaderFor','Za co przysługuje',c.leaderFor)}<div><label>Opiekun grupy</label>${options('groupGuardian',c.guardianId)}</div>${field('groupGuardianAmount','Wynagrodzenie opiekuna netto (zł / oferta)',c.guardianCommission||0,'number')}${field('groupGuardianFor','Za co przysługuje',c.guardianFor)}</div><div class="actions">${button('Zapisz grupę','saveGroup()')} ${button('Wróć',"go('adminCalculators')",'light')}</div></div>`}
function saveGroup(){if(!isAdmin())return;const c=db.calculators.find(x=>x.id===selectedCalculatorId);if(!c||!val('groupName')||!allowedCalcFile(val('groupFile')))return alert('Niepoprawny adres kalkulatora');Object.assign(c,{name:val('groupName'),file:val('groupFile'),leaderId:Number(val('groupLeader'))||null,leaderCommission:num(val('groupLeaderAmount')),leaderFor:val('groupLeaderFor'),guardianId:Number(val('groupGuardian'))||null,guardianCommission:num(val('groupGuardianAmount')),guardianFor:val('groupGuardianFor')});save();go('adminCalculators')}
function users(){if(!isAdmin())return '<h2>Brak dostępu</h2>';return `<h1>Użytkownicy</h1><div class="card"><h2>Dodaj użytkownika</h2><div class="grid">${field('userName','Imię i nazwisko')}${field('userLogin','Login')}${field('userPassword','Hasło','','password')}<div><label>Rola</label><select id="userRole"><option value="ph">PH</option><option value="office">Biuro</option><option value="admin">Admin</option></select></div><div><label>Kalkulator / grupa</label><select id="userCalculator">${db.calculators.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>${field('userMarginPercent','Procent marży PH do rozliczenia (%)',100,'number')}</div><div class="actions">${button('Utwórz użytkownika','addUserV2()')}</div></div><div class="card tablewrap"><table><tr><th>Użytkownik</th><th>Login</th><th>Rola</th><th>Kalkulator</th><th>% marży PH</th><th>Status</th><th>Akcja</th></tr>${db.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.login)}</td><td>${esc(u.role)}</td><td>${esc(db.calculators.find(c=>c.id===u.calculatorId)?.name||'—')}</td><td>${u.role==='ph'?`${num(u.marginPercent??100)}%`:'—'}</td><td>${u.active?'Aktywny':'Zablokowany'}</td><td>${button('Edytuj',`editUserV2(${u.id})`,'light')}</td></tr>`).join('')}</table></div>`}
function addUserV2(){if(!isAdmin())return;const name=val('userName').trim(),login=val('userLogin').trim(),password=val('userPassword');if(!name||!login||password.length<8)return alert('Wpisz nazwę, login i hasło min. 8 znaków');if(db.users.some(u=>u.login===login))return alert('Login zajęty');db.users.push({id:uid(),name,login,password,role:val('userRole'),calculatorId:val('userCalculator'),marginPercent:Math.min(100,num(val('userMarginPercent'))),active:true});save();render()}

function saveUserV2(){if(!isAdmin())return;const u=db.users.find(x=>x.id===selectedEditUser);if(!u)return;if(!val('eName')||!val('eLogin')||val('ePassword').length<8)return alert('Uzupełnij dane');if(db.users.some(x=>x.id!==u.id&&x.login===val('eLogin')))return alert('Login zajęty');Object.assign(u,{name:val('eName'),login:val('eLogin'),password:val('ePassword'),calculatorId:val('eCalc'),marginPercent:Math.min(100,num(val('eMargin'))),active:val('eActive')==='1'});save();go('users')}

/* GREEN NOW 2.2: skrzynka biura, dokumenty PH i zadania według grup */
const oldClientDetail22=clientDetail;
const oldSaveClientDocs22=saveClientDocs;
function docsForClient22(c){return (c.uploads||[]).map(f=>`<div class="message">📎 <b>${esc(f.category)}</b> — <a href="${f.data}" download="${esc(f.name)}">${esc(f.name)}</a><div class="small">${esc(f.author)} · ${esc(f.date)}</div></div>`).join('')||'<p>Nie dodano jeszcze dokumentów.</p>'}
function phDocuments22(c){return `<div class="card"><h2>Dokumenty od handlowca — kompletacja</h2><p>PH wybiera rodzaj dokumentu, dodaje podpisany plik i zaznacza, co przekazał. Biuro weryfikuje po wysłaniu.</p><label>Rodzaj dokumentu</label><select id="phDocType">${docsNeeded.map(d=>`<option>${esc(d)}</option>`).join('')}</select><label>PDF / zdjęcie (demo do 1 MB)</label><input id="phDocFile" type="file" accept=".pdf,image/*"><div class="actions">${button('Dodaj dokument','uploadClientDoc22()')}</div><h3>Załączone pliki</h3>${docsForClient22(c)}<h3>Checklista PH</h3>${docsNeeded.map(d=>`<div class="message">${(c.uploads||[]).some(f=>f.category===d)?'☑':'☐'} ${esc(d)}</div>`).join('')}<div class="actions">${button('Wyślij do weryfikacji','submitClient22()')}</div><p class="small">Wysłanie wymaga co najmniej jednego załączonego dokumentu. Brakujące pozycje pozostają oznaczone.</p></div>`}
clientDetail=function(){const c=db.clients.find(x=>x.id===selectedClientId);if(!clientAccess(c))return '<h2>Brak dostępu</h2>';let html=oldClientDetail22();const extra=phDocuments22(c);html=html.replace('<div class="card"><h2>Historia klienta</h2>',extra+'<div class="card"><h2>Historia klienta</h2>');if(!canManage())html=html.replace('<div class="card"><h2>Historia klienta</h2>',`<div class="card"><h2>Informacje od PH</h2><textarea id="postText" placeholder="Ważne informacje o umowie, montażu, ustalenia z klientem..."></textarea><label>Załącznik do wpisu</label><input id="postFile" type="file" accept=".pdf,image/*"><div class="actions">${button('Dodaj wpis','addClientPost()')}</div></div><div class="card"><h2>Historia klienta</h2>`);return html};
function uploadClientDoc22(){const c=db.clients.find(x=>x.id===selectedClientId);if(!clientAccess(c))return;const f=byId('phDocFile')?.files?.[0],category=val('phDocType');if(!f)return alert('Wybierz dokument');if(f.size>1024*1024)return alert('Demo: maksymalny rozmiar pliku 1 MB');if(!f.type.startsWith('image/')&&f.type!=='application/pdf'&&!f.name.toLowerCase().endsWith('.pdf'))return alert('Dozwolone PDF i zdjęcia');const r=new FileReader();r.onload=()=>{c.uploads=c.uploads||[];c.uploads.push({id:uid(),category,name:f.name,data:r.result,author:current.name,date:new Date().toLocaleString('pl-PL')});c.docs=c.docs||{};c.docs[category]='Otrzymano';try{save();render()}catch(e){c.uploads.pop();alert('Brak miejsca w pamięci przeglądarki')}};r.readAsDataURL(f)}
function submitClient22(){const c=db.clients.find(x=>x.id===selectedClientId);if(!clientAccess(c))return;if(!(c.uploads||[]).length)return alert('Najpierw dodaj podpisane dokumenty');c.submittedAt=new Date().toISOString();c.submittedBy=current.id;c.status='Weryfikacja';db.posts.push({id:uid(),clientId:c.id,author:current.id,date:new Date().toLocaleString('pl-PL'),text:'📥 PH przekazał dokumenty do weryfikacji przez biuro.'});save();render();alert('Przekazano do skrzynki biura (tylko w tej przeglądarce — demo).')}
function inbox22(){const cs=db.clients.filter(c=>c.submittedAt&&c.status!=='Zakończony').sort((a,b)=>b.submittedAt.localeCompare(a.submittedAt));return `<h1>Nowe umowy — do weryfikacji</h1><p>Podpisani klienci i pliki przesłane przez PH do biura.</p><div class="card tablewrap"><table><tr><th>Klient / PH</th><th>Montaż</th><th>Dokumenty</th><th>Data wysłania</th><th>Status</th><th></th></tr>${cs.map(c=>`<tr><td><b>${esc(c.name)}</b><div class="small">${esc(db.users.find(u=>u.id===c.owner)?.name)}</div></td><td>${esc(c.type||'—')}<div class="small">${esc(c.mountAddress||'—')}</div></td><td>${(c.uploads||[]).length} plików</td><td>${new Date(c.submittedAt).toLocaleString('pl-PL')}</td><td>${esc(c.status)}</td><td>${button('Otwórz dokumenty',`openClient(${c.id})`,'light')}</td></tr>`).join('')||'<tr><td colspan="6">Brak przesłanych umów.</td></tr>'}</table></div>`}
function newQuotes22(){const list=own(db.offers).slice().sort((a,b)=>(b.id||0)-(a.id||0));return `<h1>Nowe wyceny PH</h1><p>Historia wycen zapisanych w CRM, również z poprzednich dni. Zewnętrzny kalkulator wymaga osobnej integracji zapisu.</p><div class="card tablewrap"><table><tr><th>Klient</th><th>PH</th><th>Netto</th><th>Data</th><th>Status</th><th></th></tr>${list.map(o=>`<tr><td>${esc(o.client)}</td><td>${esc(db.users.find(u=>u.id===o.owner)?.name)}</td><td>${money(o.net)}</td><td>${esc(o.date||o.createdAt||'Brak daty w starszej ofercie')}</td><td>${esc(o.status)}</td><td>${button('Podgląd',`offerDetail(${o.id})`,'light')}</td></tr>`).join('')||'<tr><td colspan="6">Brak zapisanych wycen.</td></tr>'}</table></div>`}
dashboard=function(){const cs=own(db.clients),oo=own(db.offers),incoming=db.clients.filter(c=>c.submittedAt&&c.status==='Weryfikacja');return `<h1>Centrum pracy GREEN NOW</h1><p>Witaj, ${esc(current.name)}. Ostatnie wyceny i dokumenty do biura.</p><div class="grid3"><div class="card"><div class="small">Wyceny w CRM</div><div class="stat">${oo.length}</div></div><div class="card"><div class="small">Klienci</div><div class="stat">${cs.length}</div></div><div class="card"><div class="small">Nowe umowy do weryfikacji</div><div class="stat">${incoming.length}</div></div></div><div class="actions">${button('Nowe wyceny',"go('newQuotes')")}${canManage()?button('Nowe umowy',"go('newContracts')"):' '}${button('Klienci',"go('clients')",'light')}</div><div class="grid"><div class="card"><h2>Ostatnie wyceny PH</h2>${oo.slice(-8).reverse().map(o=>`<div class="message">${esc(o.client)} · ${money(o.net)} · ${esc(o.status)} ${button('Otwórz',`offerDetail(${o.id})`,'light')}</div>`).join('')||'Brak wycen'}</div><div class="card"><h2>Umowy i dokumenty przesłane do biura</h2>${canManage()?incoming.map(c=>`<div class="message"><b>${esc(c.name)}</b> · ${(c.uploads||[]).length} plików · ${esc(db.users.find(u=>u.id===c.owner)?.name)} ${button('Weryfikuj',`openClient(${c.id})`,'light')}</div>`).join('')||'Brak nowych umów':'Dokumenty do weryfikacji są dostępne dla biura.'}</div></div>`};

/* Przełączenie ekranów: bezpiecznie zachowujemy istniejące funkcje logowania i dane localStorage */
render=function(){if(!current)return;byId('loggedUser').textContent=current.name+' • '+roleName(current.role);let menus=[['dashboard','Start'],['newQuotes','Nowe wyceny'],['calculator','Kalkulator'],['offers','Oferty'],['clients','Klienci'],['commissions','Prowizje'],['materials','Materiały'],['tasks','Zadania']];if(canManage())menus.push(['newContracts','Nowe umowy'],['approvals','Weryfikacja']);if(isAdmin())menus.push(['adminCalculators','Admin: Kalkulatory'],['users','Użytkownicy']);byId('navigation').innerHTML=menus.map(([p,n])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${n}</button>`).join('');const views={dashboard,newQuotes:newQuotes22,newContracts:inbox22,calculator,offers,offerDetail:offerDetailView,clients,clientDetail,commissions,commissionDetail:commissionDetailView,materials,tasks,approvals,adminCalculators,groupEdit:groupEditView,users,userEditV2:userEditView};byId('content').innerHTML=(views[page]||dashboard)()};


/* GREEN NOW 3.0 — obieg klient -> wycena -> oferta -> dokumenty (demo) */
const crmStages=['Nowy','Oferta','Podpisana umowa','Umowa do realizacji','Do montażu','Zakończony montaż','Zakończony, przygotowany do zgłoszenia','Zakończony'];
const annexNames=['Formularz umowy','Pełnomocnictwo OSD','Załącznik kredytowy','Protokół audytowy','Pełnomocnictwo do dotacji FM','Informacja RODO NFOŚiGW','Oświadczenia wnioskodawcy'];
const annexFiles=['01_Formularz_umowy.pdf','02_Pelnomocnictwo_OSD.pdf','03_Zalacznik_kredytowy.pdf','04_Protokol_audytowy.pdf','05_Pelnomocnictwo_dotacja_FM.pdf','06_Informacja_RODO_NFOSiGW.pdf','07_Oswiadczenia_wnioskodawcy.pdf'];
const tabsAll=[['dashboard','Start'],['newQuotes','Nowe wyceny'],['calculator','Kalkulator'],['offers','Oferty'],['clients','Klienci'],['commissions','Prowizje'],['materials','Materiały'],['tasks','Zadania'],['newContracts','Nowe umowy'],['approvals','Weryfikacja'],['adminCalculators','Admin: Kalkulatory'],['users','Użytkownicy']];
let draftClientId=null,annexClientId=null,annexIndex=0;
function canTab(t){if(isAdmin())return true;if(['users','adminCalculators'].includes(t))return false;if(['newContracts','approvals'].includes(t)&&!canManage())return false;return !Array.isArray(current.allowedTabs)||current.allowedTabs.includes(t)}
const baseGo=go;go=function(p){const parent={quoteBuilder:'clients',newClientWizard:'clients',clientDetail:'clients',offerDetail:'offers',userEditV2:'users',groupEdit:'adminCalculators',annexEditor:'clients'}[p]||p;if(!canTab(parent))return alert('Brak uprawnień do zakładki');page=p;render()};
function newClientWizard(){return `<h1>Nowa wycena — dane klienta</h1><p>Najpierw dane klienta. Następnie wybór systemu, urządzeń i kosztów.</p><div class="card"><div class="grid">${field('wName','Imię i nazwisko / firma')}${field('wPhone','Telefon')}${field('wEmail','E-mail','','email')}${field('wMount','Adres montażu')}${field('wAddress','Adres zamieszkania')}${field('wZip','Kod pocztowy')}</div><label><input id="wSame" type="checkbox" onchange="syncWizardAddress()"> Adres zamieszkania taki sam jak adres montażu</label><div class="actions">${button('Przejdź do oferty','startQuoteWizard()')}</div></div>`}
function syncWizardAddress(){let a=byId('wAddress');a.value=byId('wSame').checked?val('wMount'):'';a.readOnly=byId('wSame').checked}
function startQuoteWizard(){const name=val('wName').trim(),mount=val('wMount').trim();if(!name||!mount)return alert('Wpisz nazwę klienta i adres montażu');const c={id:uid(),name,phone:val('wPhone'),email:val('wEmail'),mountAddress:mount,address:byId('wSame').checked?mount:val('wAddress'),zip:val('wZip'),type:'',owner:current.id,status:'Nowy',docs:{},uploads:[],annexData:{},createdAt:new Date().toISOString()};db.clients.push(c);draftClientId=c.id;save();go('quoteBuilder')}
function quoteBuilder(){const c=db.clients.find(x=>x.id===draftClientId);if(!clientAccess(c))return '<h2>Wybierz klienta</h2>';const conf=db.calculators.find(x=>x.id===(current.calculatorId||'gn4'))||db.calculators[0];const src=conf?.file||'kalkulator-green-now-4.html';const local=/^[a-zA-Z0-9_.-]+\.html$/.test(src);return `<h1>Nowa oferta — ${esc(c.name)}</h1><p>Klient: ${esc(c.name)} · Adres montażu: ${esc(c.mountAddress)}</p><div class="card"><h2>Oryginalny kalkulator GREEN NOW 4.0</h2><p>Wybierz produkty i dodatki. W kroku 4 dane klienta będą już uzupełnione. Kliknij „Generuj ofertę dla Klienta”, aby pobrać PDF i automatycznie zapisać ofertę w CRM, albo „Zapisz ofertę w CRM”.</p>${local?`<iframe id="crmCalculatorFrame" src="${esc(src)}" title="Kalkulator GREEN NOW" onload="prefillCalcBridge()" style="width:100%;height:85vh;border:1px solid #ddd;border-radius:8px"></iframe>`:`<div class="notice">Przypisany kalkulator jest na zewnętrznej domenie. Aby automatycznie zapisywać jego oferty, wgraj zintegrowany plik HTML do tego samego repozytorium CRM. <a href="${esc(src)}" target="_blank">Otwórz obecny kalkulator</a></div>`}</div>`}
function prefillCalcBridge(){const c=db.clients.find(x=>x.id===draftClientId),f=byId('crmCalculatorFrame');if(!c||!f)return;f.contentWindow.postMessage({type:'GREENNOW_PREFILL',client:{name:c.name,mount:c.mountAddress,zip:c.zip||'',phone:c.phone||'',email:c.email||''},salesperson:{name:current.name}},location.origin)}
window.addEventListener('message',function(event){if(event.origin!==location.origin||event.source!==byId('crmCalculatorFrame')?.contentWindow)return;const msg=event.data;if(!msg||msg.type!=='GREENNOW_SAVE_OFFER')return;const c=db.clients.find(x=>x.id===draftClientId);if(!clientAccess(c))return;const d=msg.offer||{},b=d.obliczenia||{};const net=Number(b.sumaNettoFinal);if(!Number.isFinite(net)||net<=0)return alert('Kalkulator nie zwrócił prawidłowej ceny.');const products=['zestawPV','magazynNisko','magazynWysoko','magazynSigen1','magazynSigen2','ladowarka','dodatkiMagazyn','dodatkiModuly','turbinaWiatrowa','klimatyzacja','wymianaFalownikMagazyn','modernizacjaRozdzielni'].map(k=>d[k]?.text).filter(x=>x&&!/^(brak|nie|--|0)/i.test(x));const existing=db.offers.find(o=>o.id===c.offerId&&o.source==='green-now-4');const o=existing||{id:uid(),clientId:c.id,client:c.name,owner:current.id,calculatorId:current.calculatorId||'gn4',createdAt:new Date().toISOString(),source:'green-now-4'};Object.assign(o,{type:products.join(' + ')||'Instalacja OZE',system:products.join(' | '),installationDetails:products.join(' | '),addons:[d.inneDodatki?.nazwa,d.przekop?.text,d.samKabel?.text].filter(Boolean).join(' | '),net,vat:Number(d.stawkaVat||.08)*100,gross:Number(b.cenaKoncowa)||net*1.08,margin:Number(b.marzaDlaPH)||0,status:o.status||'Robocza',mountAddress:c.mountAddress,calculatorSnapshot:d,updatedAt:new Date().toISOString()});if(!existing)db.offers.push(o);c.offerId=o.id;c.type=o.type;c.status='Oferta';save();selectedOfferId=o.id;go('offerDetail');alert('Oferta została zapisana w CRM i jest widoczna w zakładce Oferty.')} );
function saveQuoteWizard(){const c=db.clients.find(x=>x.id===draftClientId);if(!clientAccess(c))return;const net=num(val('qNet'));if(net<=0)return alert('Podaj cenę netto');const vat=num(val('qVat'));const details=[val('qSystem'),val('qPanels'),val('qInverter'),val('qAddons')].filter(Boolean).join(' | ');const o={id:uid(),clientId:c.id,client:c.name,owner:current.id,calculatorId:current.calculatorId||'gn4',type:val('qType'),power:val('qPower'),storage:val('qStorage'),system:val('qSystem'),panels:val('qPanels'),inverter:val('qInverter'),addons:val('qAddons'),extraDescription:val('qCosts'),installationDetails:details,net,vat,gross:net*(1+vat/100),margin:num(val('qMargin')),status:'Robocza',createdAt:new Date().toISOString(),mountAddress:c.mountAddress};db.offers.push(o);c.offerId=o.id;c.type=o.type;c.status='Oferta';save();selectedOfferId=o.id;go('offerDetail')}
function clientStagePicker(c){return `<div class="card"><h2>Etap realizacji i terminy</h2><label>Status klienta</label>${pick('stage30',crmStages,crmStages.includes(c.status)?c.status:'Nowy')}<div class="grid">${field('planned30','Planowany termin montażu',c.plannedInstallation||'','date')}${field('finished30','Data zakończenia montażu',c.finishedInstallation||'','date')}</div><div class="actions">${button('Zapisz etap','saveClientStage30()')}</div></div>`}
function saveClientStage30(){const c=db.clients.find(x=>x.id===selectedClientId);if(!clientAccess(c))return;const stage=val('stage30');if(stage==='Do montażu'&&!val('planned30'))return alert('Wybierz datę planowanego montażu');if(stage==='Zakończony montaż'&&!val('finished30'))return alert('Wpisz datę zakończenia montażu');c.status=stage;c.plannedInstallation=val('planned30');c.finishedInstallation=val('finished30');save();render()}
const prevClientDetail30=clientDetail;
clientDetail=function(){const c=db.clients.find(x=>x.id===selectedClientId);if(!clientAccess(c))return '<h2>Brak dostępu</h2>';let html=prevClientDetail30();html=html.replace('<div class="grid"><div class="card"><h2>Dane i status umowy</h2>',clientStagePicker(c)+'<div class="card"><h2>Uzupełnij załączniki</h2><p>System wstawi znane dane z karty klienta. Każdy dokument możesz osobno edytować i zapisać.</p>'+annexNames.map((n,i)=>`<div class="message"><b>${esc(n)}</b><div class="actions">${button('Uzupełnij / edytuj',`editAnnex30(${c.id},${i})`,'light')} <a class="btn light" href="dokumenty/${annexFiles[i]}" target="_blank" download>Pobierz oryginał PDF</a></div></div>`).join('')+'</div><div class="grid"><div class="card"><h2>Dane i status umowy</h2>');return html};
function editAnnex30(id,i){annexClientId=id;annexIndex=i;go('annexEditor')}
function annexEditor30(){const c=db.clients.find(x=>x.id===annexClientId);if(!clientAccess(c))return '<h2>Brak dostępu</h2>';const saved=c.annexData?.[annexIndex]||{};return `<h1>Uzupełnij załącznik — ${esc(annexNames[annexIndex])}</h1><p>Klient: ${esc(c.name)}. Dane możesz edytować bez zmiany danych głównych klienta.</p><div class="card"><div class="grid">${field('aName','Imię i nazwisko',saved.name??c.name)}${field('aPhone','Telefon',saved.phone??c.phone)}${field('aEmail','E-mail',saved.email??c.email)}${field('aAddress','Adres zamieszkania',saved.address??c.address)}${field('aMount','Adres montażu',saved.mount??c.mountAddress)}${field('aPesel','PESEL (tylko demo, nie wpisuj rzeczywistych danych)',saved.pesel||'')}${field('aPpe','Numer PPE',saved.ppe||'')}${field('aOperator','Operator OSD',saved.operator||'')}</div><label>Dodatkowe dane i oświadczenia wymagane przez ten dokument</label><textarea id="aNotes">${esc(saved.notes||'')}</textarea><div class="actions">${button('Zapisz wersję roboczą','saveAnnex30()')} ${button('Wydrukuj uzupełnione dane do PDF','printAnnex30()','light')} <a class="btn light" href="dokumenty/${annexFiles[annexIndex]}" download>Pobierz oryginalny wzór PDF</a> ${button('← Karta klienta',`openClient(${c.id})`,'light')}</div><div class="notice">Uwaga: wydruk generuje kartę danych do dokumentu, nie wypełnia jeszcze pól oryginalnego wzoru PDF. W produkcji dane PESEL i dokumenty wymagają bezpiecznego serwera.</div></div>`}
function saveAnnex30(){const c=db.clients.find(x=>x.id===annexClientId);if(!clientAccess(c))return;c.annexData=c.annexData||{};c.annexData[annexIndex]={name:val('aName'),phone:val('aPhone'),email:val('aEmail'),address:val('aAddress'),mount:val('aMount'),pesel:val('aPesel'),ppe:val('aPpe'),operator:val('aOperator'),notes:val('aNotes'),savedAt:new Date().toISOString()};save();alert('Zapisano wersję roboczą w tej przeglądarce')}
function printSheet30(title,entries){const w=window.open('','_blank');if(!w)return alert('Zezwól na otwieranie okien');const rows=entries.map(([k,v])=>`<tr><th style="text-align:left;padding:9px;border-bottom:1px solid #ddd">${esc(k)}</th><td style="padding:9px;border-bottom:1px solid #ddd">${esc(v)}</td></tr>`).join('');w.document.write(`<!doctype html><html lang="pl"><meta charset="utf-8"><title>${esc(title)}</title><style>body{font:14px Arial;margin:35px;color:#17241e}h1{color:#205841}table{width:100%;border-collapse:collapse}</style><h1>${esc(title)}</h1><p>GREEN NOW • ${new Date().toLocaleDateString('pl-PL')}</p><table>${rows}</table><p style="margin-top:25px;font-size:11px">Wydruk informacyjny z wersji demonstracyjnej CRM — nie zastępuje wzoru umowy ani załącznika.</p></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),250)}
function printAnnex30(){saveAnnex30();const c=db.clients.find(x=>x.id===annexClientId),d=c.annexData[annexIndex];printSheet30(annexNames[annexIndex]+' — dane do uzupełnienia',[['Klient',d.name],['Telefon',d.phone],['E-mail',d.email],['Adres zamieszkania',d.address],['Adres montażu',d.mount],['PESEL',d.pesel],['PPE',d.ppe],['Operator',d.operator],['Dodatkowe informacje',d.notes]])}
function printOffer30(id){const o=db.offers.find(x=>x.id===id);if(!o)return;const c=db.clients.find(x=>x.id===o.clientId);printSheet30('Oferta GREEN NOW — '+o.client,[['Klient',o.client],['Adres zamieszkania',c?.address],['Adres montażu',c?.mountAddress],['Telefon',c?.phone],['Rodzaj',o.type],['Moc PV kWp',o.power],['Magazyn kWh',o.storage],['System',o.system],['Panele',o.panels],['Falownik',o.inverter],['Dodatki',o.addons],['Cena netto',money(o.net)],['VAT',o.vat+'%'],['Cena brutto',money(o.gross)]])}
const prevOfferDetail30=offerDetailView;
offerDetailView=function(){const o=db.offers.find(x=>x.id===selectedOfferId);if(!o)return '<h2>Brak oferty</h2>';const c=db.clients.find(x=>x.id===o.clientId);return prevOfferDetail30()+`<div class="card"><h2>Produkty, klient i dokumenty</h2><p><b>Klient:</b> ${esc(o.client)} · ${esc(c?.phone||'')} · ${esc(c?.email||'')}</p><p><b>Adres zamieszkania:</b> ${esc(c?.address||'—')}<br><b>Adres montażu:</b> ${esc(c?.mountAddress||o.mountAddress||'—')}</p><p><b>System:</b> ${esc(o.system||'—')} · <b>Panele:</b> ${esc(o.panels||'—')} · <b>Falownik:</b> ${esc(o.inverter||'—')}</p><p><b>Dodatki:</b> ${esc(o.addons||'—')} · <b>Koszty dodatkowe:</b> ${esc(o.extraDescription||'—')}</p><div class="actions">${button('Generuj ofertę — drukuj / PDF',`printOffer30(${o.id})`)} ${c?button('Uzupełnij dokumenty / pobierz załączniki',`openClient(${c.id})`,'light'):''}</div><p class="small">Wybierz „Zapisz jako PDF” w oknie drukowania. Oryginalny formularz umowy i załączniki pobierzesz z karty klienta.</p></div>`};
const prevClients30=clients;
clients=function(){let html=prevClients30();return `<div class="actions">${button('Nowa wycena — zacznij od danych klienta',"go('newClientWizard')")}</div>`+html};
const prevUserEdit30=userEditView;
userEditView=function(){const u=db.users.find(x=>x.id===selectedEditUser);if(!u)return 'Brak konta';const existing=prevUserEdit30();const block=`<div class="card"><h2>Widoczność zakładek dla użytkownika</h2><p>Odznacz moduły, których ten użytkownik nie powinien widzieć.</p><div class="grid">${tabsAll.filter(([id])=>!['users','adminCalculators'].includes(id)||u.role==='admin').map(([id,label])=>`<label><input type="checkbox" class="tabPermission30" value="${id}" ${!Array.isArray(u.allowedTabs)||u.allowedTabs.includes(id)?'checked':''}> ${esc(label)}</label>`).join('')}</div></div>`;return existing+block};
const prevSaveUser30=saveUserV2;
saveUserV2=function(){const u=db.users.find(x=>x.id===selectedEditUser);if(u)u.allowedTabs=Array.from(document.querySelectorAll('.tabPermission30:checked')).map(x=>x.value);prevSaveUser30()};
render=function(){if(!current)return;byId('loggedUser').textContent=current.name+' • '+roleName(current.role);const menus=tabsAll.filter(([id])=>canTab(id));byId('navigation').innerHTML=menus.map(([p,n])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${n}</button>`).join('');const views={dashboard,newQuotes:newQuotes22,newContracts:inbox22,calculator,offers,offerDetail:offerDetailView,clients,clientDetail,commissions,commissionDetail:commissionDetailView,materials,tasks,approvals,adminCalculators,groupEdit:groupEditView,users,userEditV2:userEditView,newClientWizard,quoteBuilder,annexEditor:annexEditor30};byId('content').innerHTML=(views[page]||dashboard)()};

</script>
